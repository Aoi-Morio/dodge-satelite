[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dodge-satelite"
version = "0.2.0"
description = "Conservative satellite-aware astrophotography planning for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Morio Aoi and contributors"}]
dependencies = ["numpy>=2.0,<3", "skyfield>=1.49,<2", "sgp4>=2.23,<3", "astropy>=7,<9", "PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1", "build>=1.2,<2", "pyinstaller>=6.12,<7"]

[project.scripts]
dodge-satelite = "dodge_satelite.cli:main"

[project.gui-scripts]
dodge-satelite-gui = "dodge_satelite.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dodge_satelite = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
